```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Maker</title>
    <style>
        /* Basic styling for the QR code */
        .qr-wrapper {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="qr-wrapper">

    <h2>Create QR Code</h2>
    <p>Type any text, link, or contact information to create a QR code.</p>

    <label for="qrInput">Input Text or URL:</label>
    <input type="text" id="qrInput" placeholder="Paste link or text here..." required />

    <button id="createBtn" disabled>Create QR</button>

    <div id="qrOutput"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
    let qrInstance;

    // Get the input element and output element
    const qrInput = document.getElementById("qrInput");
    const createBtn = document.getElementById("createBtn");
    const qrOutput = document.getElementById("qrOutput");

    // Add event listener to the input element
    qrInput.addEventListener("input", function () {
        const value = qrInput.value.trim();
        createBtn.disabled = value === "";
    });

    // Add event listener to the create button
    createBtn.addEventListener("click", function () {
        const value = qrInput.value.trim();
        qrOutput.innerHTML = "";

        if (value === "") {
            alert("Please enter some text or URL");
            return;
        }

        qrInstance = new QRCode(qrOutput, {
            text: value,
            width: 200,
            height: 200
        });

        qrInput.focus();
    });

    // Disable the create button initially
    createBtn.disabled = true;
</script>

</body>
</html>
