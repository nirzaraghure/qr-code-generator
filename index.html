```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QR Code Generator">
  <meta name="keywords" content="QR Code, Generator">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p id="description">Enter any link, text, or contact to generate its QR code.</p>
    <label for="text">Enter text or URL:</label>
    <input type="text" id="text" placeholder="Enter text or URL..." required>
    <button id="generate-btn">Generate</button>
    <div id="qrcode"></div>
  </div>

  <script src="script.js"></script>
  <script>
    // Initialize QR code generator
    var qrcode = new QRCode(document.getElementById("qrcode"), {
      text: "",
      width: 256,
      height: 256,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    // Generate QR code on button click
    document.getElementById("generate-btn").addEventListener("click", function() {
      var text = document.getElementById("text").value;
      qrcode.makeCode(text);
    });
  </script>
</body>
</html>
