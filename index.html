```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <meta name="description" content="QR code generator for links, text, and contact information">
  <meta name="author" content="Your Name">
  <meta name="keywords" content="QR code, generator, link, text, contact">
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p>Enter any link, text, or contact to generate its QR code</p>
    <label for="text">Enter text or URL:</label>
    <input type="text" id="text" placeholder="Enter text or URL..." required pattern="[a-zA-Z0-9:/._-]+" title="Allowed characters: a-zA-Z0-9:/._-">
    <button onclick="generateQR()">Generate</button>
    <div id="qrcode"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
  <script>
    // Add CSRF token validation
    const form = document.querySelector('form');
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

    if (!csrfToken) {
      console.error('CSRF token not found');
    } else {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('text').value;
        const qrcode = new QRCode(document.getElementById('qrcode'), {
          text: input,
          width: 128,
          height: 128,
        });
        qrcode.makeCode(input);
      });
    }
  </script>
</body>
</html>
