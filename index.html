```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p>Enter any link, text, or contact to generate its QR code</p>
    <label for="text">Enter text or URL:</label>
    <input type="text" id="text" placeholder="Enter text or URL..." required>
    <button onclick="generateQR()">Generate</button>
    <div id="qrcode"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
  <script>
    let qrInstance;
    document.getElementById("text").addEventListener("input", function () {
      const value = this.value.trim();
      if (value === "") {
        document.getElementById("qrcode").innerHTML = "";
      }
    });
    document.getElementById("text").addEventListener("focus", function () {
      this.placeholder = "Enter text or URL...";
    });
    document.getElementById("text").addEventListener("blur", function () {
      this.placeholder = "Enter text or URL...";
    });
    document.getElementById("text").addEventListener("keyup", function (e) {
      if (e.key === "Enter") {
        document.getElementById("generateQR").click();
      }
    });
    document.getElementById("generateQR").addEventListener("click", function () {
      const value = document.getElementById("text").value.trim();
      const container = document.getElementById("qrcode");
      container.innerHTML = "";
      if (value === "") {
        alert("Please enter some text or URL");
        return;
      }
      qrInstance = new QRCode(container, {
        text: value,
        width: 200,
        height: 200
      });
    });
  </script>
</body>
</html>
```
